; melonDS-walker IR dongle firmware (ESP32-S3, Arduino-ESP32 3.x)
;
; Build:   pio run                       (default env: esp32-s3-devkitc-1)
;          pio run -e seeed_xiao_esp32s3
; Flash:   pio run -e <env> -t upload [--upload-port /dev/ttyACM0]
; Tests:   pio test -e native            (COBS unit tests on the host)
;
; The platform is pinned to the pioarduino release that ships Arduino-ESP32
; 3.3.5 / ESP-IDF 5.5, which is the one already installed under
; ~/.platformio/platforms/espressif32, so no download is needed.

[platformio]
default_envs = esp32-s3-devkitc-1

[esp32s3_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Native USB in TinyUSB (USB-OTG) mode, no CDC console on boot. The board
; JSONs set ARDUINO_USB_MODE=1 (USB-Serial-JTAG) and the XIAO also sets
; CDC_ON_BOOT=1, so remove those first.
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; USB VID:PID and strings are set at runtime in src/host_link.cpp.
    ; --- IR pin / polarity overrides (defaults live in src/config.h) ---
    ; -DIR_PIN_TX=1
    ; -DIR_PIN_RX=2
    ; -DIR_PIN_SD=4          ; -1 if SD is hard-wired to GND
    ; -DIR_TX_INVERT=1       ; invert IrDA TX pulses (UART_SIGNAL_IRDA_TX_INV)
    ; -DIR_RX_INVERT=1       ; invert IrDA RX decoder input (UART_SIGNAL_IRDA_RX_INV)
    ; -DIR_RX_INVERT_PAD=1   ; invert the RXD pad instead (UART_SIGNAL_RXD_INV)
    ; -DIR_IRDA_DPLX=1       ; set the IrDA duplex/loopback bit (forum fix for "RX dead")
; TinyUSB mode: the Arduino core reboots into the ROM bootloader when it sees
; esptool's DTR/RTS sequence or a 1200-baud "touch" on the CDC port. The ROM
; then re-enumerates as USB-Serial-JTAG (303a:1001), so wait for the new port.
; Strict warnings for our own sources (src/) only, not the Arduino core.
; lib/cobs gets -Wall -Wextra in the native test env.
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
upload_speed = 460800
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

[env:esp32-s3-devkitc-1]
extends = esp32s3_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32s3_common.build_flags}
    ; Addressable RGB LED: GPIO48 on DevKitC-1 v1.0, GPIO38 on v1.1.
    -DSTATUS_LED_PIN=48
    -DSTATUS_LED_RGB=1

[env:seeed_xiao_esp32s3]
extends = esp32s3_common
board = seeed_xiao_esp32s3
build_flags =
    ${esp32s3_common.build_flags}
    ; Orange user LED on GPIO21, active low.
    -DSTATUS_LED_PIN=21
    -DSTATUS_LED_ACTIVE_LOW=1

; Host-side unit tests for the COBS codec (lib/cobs). Needs a host gcc/g++.
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++17 -Wall -Wextra
